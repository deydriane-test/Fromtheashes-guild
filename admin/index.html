<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FromTheAshes — Guild Admin</title><link rel="stylesheet" href="../styles.css?v=24"><link rel="stylesheet" href="admin.css?v=2">
</head>
<body class="adminPage"><div class="embers"></div>
<header class="adminHeader"><a class="logo" href="../">FROM<span>THE</span>ASHES</a><div class="adminHeaderRight"><span id="adminIdentity"></span><button id="logoutBtn" class="ghost adminLogout">LOG OUT</button></div></header>
<main class="adminMain">
<section id="loginPanel" class="adminPanel"><div class="eyebrow">GUILD ACCESS</div><h1>THE<br><i>CLUBHOUSE.</i></h1><p>Log in with your guild account. Your permissions come from your guild role.</p><form id="loginForm" class="adminForm"><label>EMAIL<input id="loginEmail" type="email" required autocomplete="email"></label><label>PASSWORD<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="btn">LOG IN ↗</button><p id="loginStatus" class="formStatus"></p></form></section>
<section id="deniedPanel" class="adminPanel" hidden><div class="eyebrow">MEMBER AREA</div><h1>NO STAFF<br><i>ACCESS.</i></h1><p id="deniedText">Your current role does not have roster administration access.</p></section>
<section id="dashboard" class="adminDashboard" hidden><div class="adminTitleRow"><div><div class="eyebrow">FROMTHEASHES • GUILD ADMIN</div><h1>THE<br><i>ROSTER.</i></h1></div><div id="roleBadge" class="pendingCount"></div></div><p id="adminIntro" class="adminIntro"></p><div id="rosterAdminList" class="rosterAdminList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js?v=3"></script><script src="admin.js?v=2"></script></body></html>
