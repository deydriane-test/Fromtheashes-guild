<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FromTheAshes — Account</title><link rel="stylesheet" href="../styles.css?v=24"><link rel="stylesheet" href="account.css?v=1"></head>
<body class="adminPage"><div class="embers"></div>
<header class="adminHeader"><a class="logo" href="../">FROM<span>THE</span>ASHES</a><div class="adminHeaderRight"><a class="ghost" href="../">BACK TO SITE</a></div></header>
<main class="adminMain">
<section id="authPanel" class="adminPanel"><div class="eyebrow">FROMTHEASHES • ACCOUNT</div><h1>JOIN THE<br><i>ASHES.</i></h1>
<p>Create your guild account. Every new account starts as a <b>RECRUIT</b>. Your character stays hidden from the public until approved by guild leadership.</p>
<div class="accountTabs"><button id="showSignup" class="tab active">CREATE ACCOUNT</button><button id="showLogin" class="tab">LOG IN</button></div>
<form id="signupForm" class="adminForm">
<label>USERNAME<input id="username" maxlength="32" required autocomplete="username" placeholder="Your unique guild username"></label>
<label>EMAIL<input id="email" type="email" required autocomplete="email" placeholder="For login and account recovery"></label>
<label>PASSWORD<input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label>
<label>CHARACTER NAME<input id="character" maxlength="40" required autocomplete="nickname" placeholder="Your RF Online Next character"></label>
<label>DISCORD ID / USERNAME<input id="discord" maxlength="80" autocomplete="off" placeholder="Your Discord ID or @username"></label>
<button class="btn" type="submit">CREATE ACCOUNT ↗</button><p id="signupStatus" class="formStatus" role="status"></p></form>
<form id="loginForm" class="adminForm" hidden>
<label>EMAIL<input id="loginEmail" type="email" required autocomplete="email"></label><label>PASSWORD<input id="loginPassword" type="password" required autocomplete="current-password"></label>
<button class="btn" type="submit">LOG IN ↗</button><p id="loginStatus" class="formStatus" role="status"></p></form></section>
<section id="accountPanel" class="adminPanel" hidden><div class="eyebrow">YOUR ACCOUNT</div><h1>WELCOME,<br><i id="accountUsername">RECRUIT.</i></h1><p id="accountRole"></p><div id="accountCharacter" class="accountCard"></div><button id="accountLogout" class="ghost">LOG OUT</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js?v=3"></script><script src="account.js?v=1"></script></body></html>
