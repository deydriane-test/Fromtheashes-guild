<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FromTheAshes — Discord SSO</title>
<link rel="stylesheet" href="../styles.v2.css?v=20261002-portal">
<link rel="stylesheet" href="account.v2.css?v=20261002-portal2">
</head>
<body class="portalAuthPage">
<div class="embers"></div><div class="scrollGlow"></div>
<header class="portalHeader">
  <div class="portalMasthead">
    <a class="portalLogo" href="../" aria-label="FromTheAshes"><img src="../assets/Ashes.png?v=16" alt="FromTheAshes guild logo"></a>
    <div class="portalMastheadGlow"></div>
  </div>
  <nav class="portalNav" aria-label="Primary navigation">
    <a href="../">⌂ <span>HOME</span></a>
    <a href="../#leadership">♟ <span>ROSTER</span></a>
    <a href="register.html">▣ <span>APPLY</span></a>
    <a href="../#events">▦ <span>EVENTS</span></a>
    <a href="../#rules">▤ <span>RESOURCES</span></a>
    <div class="portalNavSpacer"></div>
    <a class="portalNavDiscord" href="https://discord.gg/RMbMurbsug">DISCORD ↗</a>
  </nav>
</header>
<main class="portalAuthMain">
  <section class="portalAuthHero">
    <div class="portalEyebrow">FROMTHEASHES • DISCORD SSO</div>
    <div class="portalAuthGrid">
      <div class="portalAuthCopy">
        <h1>ONE LAST<br><i>THING.</i></h1>
        <p>Your Discord identity is verified. Enter your RF Online Next character to complete your guild application.</p>
      </div>
      <div class="portalAuthCard">
        <div class="portalCardHead"><span>GUILD APPLICATION</span><span>DISCORD CONNECTED</span></div>
        <div class="discordIdentity portalIdentity"><strong id="discordName">DISCORD</strong><small id="discordId"></small></div>
        <form id="discordCompleteForm" class="portalCharacterForm">
          <label>CHARACTER NAME<input id="character" maxlength="40" required autocomplete="nickname" placeholder="Your RF Online Next character"></label>
          <button class="btn portalSubmit" type="submit">JOIN THE GUILD ↗</button>
          <p id="completeStatus" class="formStatus" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.v1.js"></script>
