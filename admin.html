<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FromTheAshes Admin</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:800px;margin:auto;padding:130px 7vw}.box{background:#111114;border:1px solid var(--line);padding:30px;margin-top:30px}label{display:block;color:#aaa;font:700 12px Rajdhani;letter-spacing:.15em;margin:18px 0 7px}input,select{width:100%;background:#070708;color:#fff;border:1px solid var(--line);padding:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.save{border:0;margin-top:25px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="admin"><small>FROMTHEASHES • ADMIN</small><h1>GUILD <i>SCHEDULE</i></h1><div class="box"><p class="copy">This is the admin interface prototype. Shared officer login/database will be connected next so changes are visible to everyone.</p><label>DISCORD INVITE</label><input id="d" placeholder="https://discord.gg/..."><label>TIMEZONE</label><select id="z"><option value="America/Chicago">Central Time</option><option value="America/New_York">Eastern Time</option><option value="America/Denver">Mountain Time</option><option value="America/Los_Angeles">Pacific Time</option><option value="UTC">UTC</option></select><h3>GUILD RAID</h3><div class="row"><div><label>DAY</label><select id="rd"></select></div><div><label>TIME</label><input id="rt" type="time"></div></div><h3>GUILD EXPEDITION</h3><div class="row"><div><label>DAY</label><select id="ed"></select></div><div><label>TIME</label><input id="et" type="time"></div></div><button class="btn save" onclick="save()">SAVE</button><p id="msg" class="copy"></p></div></main><script>const ds=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];for(const id of["rd","ed"]){for(const d of ds){let o=document.createElement("option");o.value=d;o.textContent=d;document.getElementById(id).append(o)}}function save(){localStorage.setItem("fta",JSON.stringify({discordUrl:d.value,timezone:z.value,raid:{day:rd.value,time:rt.value},expedition:{day:ed.value,time:et.value}}));msg.textContent="Saved in this browser. Shared admin storage will be connected next."}</script></body></html>
