<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FromTheAshes | Officer Desk</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="admin">
<div class="eyebrow">FROMTHEASHES • OFFICER DESK</div>
<h1>KEEP THE<br><i>CHAOS</i><br>ORGANIZED.</h1>
<div class="box">
<p class="copy">This is the schedule admin prototype. Shared officer login/database still needs to be connected so changes made here can update the public site for everyone.</p>
<label>DISCORD INVITE</label><input id="d" placeholder="https://discord.gg/...">
<label>TIMEZONE</label><select id="z"><option value="America/Chicago">Central Time</option><option value="America/New_York">Eastern Time</option><option value="America/Denver">Mountain Time</option><option value="America/Los_Angeles">Pacific Time</option><option value="UTC">UTC</option></select>
<h3>GUILD RAID</h3><div class="row"><div><label>DAY</label><select id="rd"></select></div><div><label>TIME</label><input id="rt" type="time"></div></div>
<h3>GUILD EXPEDITION</h3><div class="row"><div><label>DAY</label><select id="ed"></select></div><div><label>TIME</label><input id="et" type="time"></div></div>
<button class="btn save" onclick="save()">SAVE IT 🔥</button><p id="msg" class="copy"></p>
</div></main>
<style>.admin{max-width:850px;margin:auto;padding:125px 7vw}.admin h1{font:900 clamp(65px,10vw,120px) "Barlow Condensed";line-height:.8;margin:30px 0}.admin h1 i{font-style:normal;color:transparent;-webkit-text-stroke:1px #eee}.box{background:#131318;border:1px solid var(--line);padding:30px;box-shadow:8px 8px 0 #050506}.box label{display:block;color:#aaa;font:800 11px "Barlow Condensed";letter-spacing:.15em;margin:18px 0 7px}.box input,.box select{width:100%;background:#09090b;color:#fff;border:1px solid var(--line);padding:13px;font:500 14px "Space Grotesk"}.box h3{font:800 24px "Barlow Condensed";color:var(--gold);margin:32px 0 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.save{border:0;margin-top:25px;cursor:pointer}@media(max-width:600px){.row{grid-template-columns:1fr}}</style>
<script>
const ds=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
for(const id of["rd","ed"]){for(const day of ds){const o=document.createElement("option");o.value=day;o.textContent=day;document.getElementById(id).append(o)}}
rd.value="Sunday";ed.value="Sunday";rt.value="19:00";et.value="19:00";z.value="America/Chicago";
function save(){localStorage.setItem("fta",JSON.stringify({discordUrl:d.value,timezone:z.value,raid:{day:rd.value,time:rt.value},expedition:{day:ed.value,time:et.value}}));msg.textContent="Saved in this browser. Shared officer storage is the next upgrade."}
</script></body></html>
