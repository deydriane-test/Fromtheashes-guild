<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From The Ashes</title>
<meta name="description" content="From The Ashes — RF Online Next multi-game community.">
<style>
html,body{margin:0;min-height:100%;background:#07090c;color:#f3eee8;font-family:system-ui,sans-serif}
body{display:grid;place-items:center}
.routeStatus{opacity:.75;font-size:13px;letter-spacing:.08em}
</style>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var forced=params.get("view");
  var mobile=forced==="mobile" || (forced!=="desktop" && matchMedia("(max-width: 700px)").matches);
  params.delete("view");
  var query=params.toString();
  var target=mobile?"mobile.html":"desktop.html";
  location.replace(target+(query?"?"+query:"")+location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=desktop.html"></noscript>
</head>
<body><div class="routeStatus">LOADING FROM THE ASHES…</div></body>
</html>
