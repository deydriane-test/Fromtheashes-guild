name: Generate Character Bars

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_character_bars.py"
      - "character-bars.json"
      - "assets/avatars/avatar-*.webp"
      - "assets/character-bars/styles/*.webp"
      - "assets/character-bars/styles/**"
      - ".github/workflows/generate-character-bars.yml"

permissions:
  contents: write

concurrency:
  group: character-bar-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate avatar and bar combinations
        run: python tools/generate_character_bars.py --clean

      - name: Upload generated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: character-bar-previews
          path: |
            assets/character-bars/generated/*-preview.webp
            assets/avatars/generated/preview.webp
            assets/character-bars/generated/bar-001/avatar-001.webp
            assets/character-bars/generated/bar-001/avatar-005.webp
            assets/character-bars/generated/bar-001/avatar-010.webp
            assets/character-bars/generated/bar-001/avatar-021.webp
            assets/character-bars/generated/bar-001/avatar-030.webp
            assets/character-bars/generated/bar-001/avatar-044.webp

      - name: Commit generated character bars
        run: |
          git config user.name "From The Ashes Asset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/character-bars/generated assets/avatars/generated
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git commit -m "Generate character bar composites"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
